<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy New Year</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(1000px 600px at 50% 20%, #ffd36a 0%, #ff7f50 35%, #a64dff 70%, #1b1b2f 100%);
      --card-bg: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --accent: #ffeaa7;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(900px, 92vw);
      background: var(--card-bg);
      backdrop-filter: blur(8px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-align: center;
    }

    .headline {
      font-weight: 800;
      font-size: clamp(28px, 5vw, 54px);
      letter-spacing: 0.5px;
      margin: 0 0 14px;
    }

    .sub {
      font-weight: 600;
      font-size: clamp(16px, 2.5vw, 22px);
      color: var(--accent);
      margin: 0 0 24px;
    }

    .image-wrap {
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      background: rgba(0,0,0,0.25);
    }

    .image-wrap img {
      display: block;
      width: min(720px, 88vw);
      height: auto;
      object-fit: cover;
    }

    .spark {
      margin-top: 22px;
      display: inline-flex;
      gap: 10px;
      align-items: center;
      font-weight: 600;
      color: #fef3c7;
      opacity: 0.9;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd36a;
      box-shadow: 0 0 12px #ffd36a, 0 0 24px #ff9f1a;
      animation: glow 1.4s ease-in-out infinite alternate;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes glow {
      from { transform: translateY(0); opacity: 0.7; }
      to   { transform: translateY(-3px); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="headline">Happy New Year</h1>
      <p class="sub">To friendship, laughter, and new beginnings</p>
